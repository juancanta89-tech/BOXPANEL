<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOXPANEL | Panel Reseller</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#f0f6ff;font:15px system-ui,Arial}a{color:inherit;text-decoration:none}button{cursor:pointer;font:inherit}.layout{display:flex;min-height:100vh}.side{width:245px;background:#101a2e;padding:25px 14px;border-right:1px solid #2b3954}.brand{font-size:25px;font-weight:900;margin:0 10px 30px}.brand span{color:#43d4e7}.nav{display:block;width:100%;text-align:left;padding:13px;border:0;border-radius:11px;color:#ccd9eb;background:transparent;margin:3px 0}.nav.active,.nav:hover{background:#1e3a51;color:#6ce7f4}.main{flex:1;min-width:0;padding:27px;max-width:1150px}h1{font-size:clamp(23px,4vw,34px)}.muted{color:#9cb0c8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.card{background:#142139;border:1px solid #293e5a;padding:22px;border-radius:16px}.card strong{display:block;font-size:26px;margin:9px 0}.panel{background:#142139;border:1px solid #293e5a;border-radius:16px;padding:22px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #2a3c55}input,select{width:100%;padding:12px;background:#0b1628;color:#fff;border:1px solid #38526e;border-radius:10px;margin:7px 0 16px}.btn{background:#45d4e4;color:#061321;border:0;padding:12px 18px;border-radius:10px;font-weight:700}.warn{background:#372a1a;color:#ffdaa6;border:1px solid #74562b;padding:14px;border-radius:12px;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.mobilebar{display:none}@media(max-width:750px){.layout{display:block}.side{width:auto;padding:13px}.brand{margin:5px}.mobilebar{display:block}.navlist{display:flex;overflow:auto;gap:5px}.nav{white-space:nowrap;width:auto;padding:10px}.main{padding:17px}.panel{overflow:auto}}</style></head><body><div class="layout"><aside class="side"><div class="brand">BOX<span>PANEL</span></div><div class="navlist" id="nav"></div></aside><main class="main"><div class="top"><h1 id="heading">Resumen</h1><span class="muted">Cuenta reseller · Vista demostrativa</span></div><div class="warn">Prototipo visual. No hay inicio de sesión ni datos reales conectados. Las acciones de administración están deshabilitadas hasta desplegar el backend protegido.</div><div id="view"></div></main></div><script>const sections=[['resumen','🏠 Resumen'],['clientes','👥 Clientes'],['crear','➕ Crear cliente'],['renovar','🔄 Renovaciones'],['creditos','💳 Créditos'],['aplicaciones','📺 Mi aplicación'],['operaciones','📋 Historial'],['soporte','💬 Soporte'],['cuenta','⚙️ Mi cuenta']];const demos=[['Cliente ejemplo 01','Activo','31/12/2026'],['Cliente ejemplo 02','Vencido','01/10/2026']];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function table(head,rows){return '<div class="panel"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function form(fields){return '<div class="panel">'+fields.map(x=>'<label>'+x+'<input disabled placeholder="Disponible tras conectar el servidor"></label>').join('')+'<button class="btn" disabled title="Pendiente de backend">Guardar (próximamente)</button></div>'}function show(){const key=(location.hash||'#resumen').slice(1);const section=sections.find(s=>s[0]===key)||sections[0];document.getElementById('heading').textContent=section[1];document.getElementById('nav').innerHTML=sections.map(s=>'<a class="nav '+(s[0]===section[0]?'active':'')+'" href="#'+s[0]+'">'+s[1]+'</a>').join('');let h='';switch(section[0]){case 'resumen':h='<div class="cards">'+[['Clientes','2 (ejemplo)'],['Créditos','0 (ejemplo)'],['Activos','1 (ejemplo)'],['Vencidos','1 (ejemplo)']].map(a=>'<div class="card">'+a[0]+'<strong>'+a[1]+'</strong></div>').join('')+'</div>'+table(['Cliente','Estado','Vencimiento'],demos);break;case 'clientes':h=table(['Cliente','Estado','Vencimiento'],demos);break;case 'crear':h=form(['Usuario del cliente','Contraseña','Plan','Fecha de vencimiento']);break;case 'renovar':h=form(['Cliente','Meses a renovar']);break;case 'creditos':h='<div class="cards"><div class="card">Saldo disponible<strong>0 (ejemplo)</strong></div><div class="card">Créditos consumidos<strong>0 (ejemplo)</strong></div></div><p class="muted">Los créditos solo se modificarán mediante operaciones verificadas en el servidor.</p>';break;case 'aplicaciones':h='<div class="panel"><h2>Aplicación asignada</h2><p>Logo, nombre, versión y descarga serán configurados desde el panel maestro.</p><p class="muted">El reseller no puede modificar la marca BOXPANEL.</p></div>';break;case 'operaciones':h=table(['Fecha','Operación','Créditos'],[['—','Sin operaciones reales','—']]);break;case 'soporte':h='<div class="panel">Canal de soporte pendiente de configuración.</div>';break;case 'cuenta':h='<div class="panel">La cuenta individual se habilitará con autenticación segura. No introduzcas contraseñas en esta demostración.</div>'}document.getElementById('view').innerHTML=h}addEventListener('hashchange',show);show()</script></body></html>
