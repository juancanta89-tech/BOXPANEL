<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOXPANEL — Apps & Software</title><style>*{box-sizing:border-box}body{margin:0;background:#080d19;color:#eef4ff;font:16px system-ui,Arial}header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 7%;background:#0b1120ee;border-bottom:1px solid #24314a;z-index:2}a{color:inherit;text-decoration:none}nav{display:flex;gap:20px;flex-wrap:wrap}a:hover{color:#51d9e9}.logo{font-size:24px;font-weight:900;letter-spacing:1px}.logo span{color:#42d4e6}main{max-width:1200px;margin:auto;padding:20px}.hero{padding:100px 15px 75px;text-align:center;background:radial-gradient(ellipse at top,#183657 0%,#080d19 65%)}h1{font-size:clamp(40px,8vw,82px);margin:10px 0}h1 span{color:#46d3e4}.muted{color:#a7b6ca}.cta{display:inline-block;background:#43d3e4;color:#06111a;border-radius:30px;padding:14px 26px;margin:20px 8px;font-weight:800}.ghost{background:#18263a;color:white}.section{padding:50px 0}h2{font-size:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.card{background:linear-gradient(155deg,#17253c,#0c1525);border:1px solid #293e58;border-radius:20px;padding:25px;min-height:245px}.art{font-size:46px;margin:10px 0}.tag{color:#58d9e7;font-size:12px;letter-spacing:2px;text-transform:uppercase}.card p{color:#b0bfd2;line-height:1.6}button{cursor:pointer;border:0}.back{color:#57d7e7}.notice{padding:16px;border:1px solid #38506b;border-radius:12px;background:#101e31}footer{text-align:center;border-top:1px solid #24314a;padding:35px;color:#9daec4}@media(max-width:650px){header{display:block;text-align:center}nav{justify-content:center;margin-top:15px;gap:12px;font-size:13px}.hero{padding-top:65px}}</style></head><body><header><a class="logo" href="#/">▣ BOX<span>PANEL</span></a><nav><a href="#/">Inicio</a><a href="#/catalogo">Aplicaciones</a><a href="#/funciones">Funciones</a><a href="#/contacto">Contacto</a></nav></header><main id="app"></main><footer>© 2026 BOXPANEL · Prototipo público v0.3 · Proyecto independiente</footer><script>const products=[{id:"tv",name:"BOX TV",icon:"📺",tag:"Android TV / Fire TV",desc:"Experiencia optimizada para pantallas grandes, control remoto, canales, películas y series."},{id:"mobile",name:"BOX Mobile",icon:"📱",tag:"Android",desc:"Interfaz de reproducción para móviles con búsqueda, favoritos y continuidad."},{id:"studio",name:"BOX Studio",icon:"🎬",tag:"Media",desc:"Galerías, presentación de contenido y personalización de la experiencia."},{id:"manager",name:"BOX Manager",icon:"⚙️",tag:"Administración",desc:"Concepto de gestión de productos, imágenes y enlaces desde un panel central."}];function card(p){return '<a class="card" href="#/producto/'+p.id+'"><div class="tag">'+p.tag+'</div><div class="art">'+p.icon+'</div><h3>'+p.name+'</h3><p>'+p.desc+'</p><strong>Ver detalles →</strong></a>'}function render(){let path=location.hash.slice(1)||'/';let html='';if(path==='/'){html='<section class="hero"><div class="tag">APPS · SOFTWARE · STREAMING</div><h1>Experiencias <span>digitales</span><br>sin límites</h1><p class="muted">Diseñamos experiencias modernas para cada pantalla.</p><a class="cta" href="#/catalogo">Explorar catálogo →</a><a class="cta ghost" href="#/contacto">Contactar</a></section><section class="section"><h2>Aplicaciones destacadas</h2><div class="grid">'+products.map(card).join('')+'</div></section>'}else if(path==='/catalogo'){html='<section class="section"><h1>Catálogo</h1><p class="muted">Conceptos visuales de demostración, no productos disponibles para comprar.</p><div class="grid">'+products.map(card).join('')+'</div></section>'}else if(path.startsWith('/producto/')){let p=products.find(x=>x.id===path.split('/')[2]);html=p?'<section class="section"><a class="back" href="#/catalogo">← Volver al catálogo</a><div class="art">'+p.icon+'</div><div class="tag">'+p.tag+'</div><h1>'+p.name+'</h1><p class="muted">'+p.desc+'</p><div class="notice">Ficha en desarrollo: las capturas, descargas y funciones reales se incorporarán tras su validación.</div></section>':'<h2>Producto no encontrado</h2>'}else if(path==='/funciones'){html='<section class="section"><h1>Funciones</h1><div class="grid"><div class="card"><h3>Diseño adaptable</h3><p>Diseñado para móviles, tabletas y escritorio.</p></div><div class="card"><h3>Catálogo navegable</h3><p>Productos con páginas individuales.</p></div><div class="card"><h3>Administración futura</h3><p>Panel privado, autenticación y gestión de contenido pendientes.</p></div></div></section>'}else if(path==='/contacto'){html='<section class="section"><h1>Contacto</h1><p class="muted">Los canales comerciales se habilitarán cuando se aprueben los datos de contacto de BOXPANEL.</p><div class="notice">Próximamente: WhatsApp, Telegram y formulario seguro.</div></section>'}else{html='<section class="section"><h2>Página no encontrada</h2><a href="#/">Ir al inicio</a></section>'}document.getElementById('app').innerHTML=html;scrollTo(0,0)}addEventListener('hashchange',render);render();</script></body></html>
