<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOXPANEL — Catálogo de aplicaciones y software</title><style>*{box-sizing:border-box}body{margin:0;background:#080d19;color:#eef4ff;font:16px system-ui,Arial}header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 7%;background:#0b1120ee;border-bottom:1px solid #24314a;z-index:2}a{color:inherit;text-decoration:none}nav{display:flex;gap:20px;flex-wrap:wrap}a:hover{color:#51d9e9}.logo{font-size:24px;font-weight:900;letter-spacing:1px}.logo span{color:#42d4e6}main{max-width:1200px;margin:auto;padding:20px}.hero{padding:100px 15px 75px;text-align:center;background:radial-gradient(ellipse at top,#183657 0%,#080d19 65%)}h1{font-size:clamp(40px,8vw,82px);margin:10px 0}h1 span{color:#46d3e4}.muted{color:#a7b6ca}.cta{display:inline-block;background:#43d3e4;color:#06111a;border-radius:30px;padding:14px 26px;margin:20px 8px;font-weight:800}.ghost{background:#18263a;color:white}.section{padding:50px 0}h2{font-size:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.card{background:linear-gradient(155deg,#17253c,#0c1525);border:1px solid #293e58;border-radius:20px;padding:25px;min-height:245px}.art{font-size:46px;margin:10px 0}.tag{color:#58d9e7;font-size:12px;letter-spacing:2px;text-transform:uppercase}.card p{color:#b0bfd2;line-height:1.6}button{cursor:pointer;border:0}.back{color:#57d7e7}.notice{padding:16px;border:1px solid #38506b;border-radius:12px;background:#101e31}footer{text-align:center;border-top:1px solid #24314a;padding:35px;color:#9daec4}@media(max-width:650px){header{display:block;text-align:center}nav{justify-content:center;margin-top:15px;gap:12px;font-size:13px}.hero{padding-top:65px}}</style></head><body><header><a class="logo" href="#/">▣ BOX<span>PANEL</span></a><nav><a href="#/">Inicio</a><a href="#/catalogo">Aplicaciones</a><a href="#/funciones">Funciones</a><a href="#/contacto">Contacto</a></nav></header><main id="app"></main><footer>© 2026 BOXPANEL · Prototipo público v0.6 · Proyecto independiente</footer><script>const products=[{id:"tv",name:"BOX TV",icon:"📺",tag:"Android TV / Fire TV",desc:"Experiencia optimizada para pantallas grandes, control remoto, canales, películas y series."},{id:"mobile",name:"BOX Mobile",icon:"📱",tag:"Android",desc:"Interfaz de reproducción para móviles con búsqueda, favoritos y continuidad."},{id:"studio",name:"BOX Studio",icon:"🎬",tag:"Media",desc:"Galerías, presentación de contenido y personalización de la experiencia."},{id:"manager",name:"BOX Manager",icon:"⚙️",tag:"Administración",desc:"Concepto de gestión de productos, imágenes y enlaces desde un panel central."}];function card(p){return '<a class="card" href="#/producto/'+p.id+'"><div class="tag">'+p.tag+'</div><div class="art">'+p.icon+'</div><h3>'+p.name+'</h3><p>'+p.desc+'</p><strong>Ver detalles →</strong></a>'}function render(){let path=location.hash.slice(1)||'/';let html='';if(path==='/'){html='<section class="hero"><div class="tag">APPS · SOFTWARE · STREAMING</div><h1>Experiencias <span>digitales</span><br>sin límites</h1><p class="muted">Catálogo de aplicaciones, fichas informativas y experiencias modernas para cada pantalla.</p><a class="cta" href="#/catalogo">Explorar catálogo →</a><a class="cta ghost" href="#/contacto">Contactar</a></section><section class="section"><h2>Aplicaciones destacadas</h2><div class="grid">'+products.map(card).join('')+'</div></section>'}else if(path==='/catalogo'){html='<section class="section"><h1>Catálogo</h1><p class="muted">Conceptos visuales de demostración, no productos disponibles para comprar.</p><div class="grid">'+products.map(card).join('')+'</div></section>'}else if(path.startsWith('/producto/')){let p=products.find(x=>x.id===path.split('/')[2]);html=p?'<section class="section"><a class="back" href="#/catalogo">← Volver al catálogo</a><div class="art">'+p.icon+'</div><div class="tag">'+p.tag+'</div><h1>'+p.name+'</h1><p class="muted">'+p.desc+'</p><div class="notice">Ficha en desarrollo: las capturas, descargas y funciones reales se incorporarán tras su validación.</div></section>':'<h2>Producto no encontrado</h2>'}else if(path==='/funciones'){html='<section class="section"><h1>Funciones</h1><div class="grid"><div class="card"><h3>Diseño adaptable</h3><p>Diseñado para móviles, tabletas y escritorio.</p></div><div class="card"><h3>Catálogo navegable</h3><p>Productos con páginas individuales.</p></div><div class="card"><h3>Administración futura</h3><p>Panel privado, autenticación y gestión de contenido pendientes.</p></div></div></section>'}else if(path==='/contacto'){html='<section class="section"><h1>Contacto</h1><p class="muted">Estamos preparando los canales oficiales de contacto de BOXPANEL.</p><div class="notice">Contacto en preparación. No introduzcas información personal ni contraseñas en esta versión de demostración.</div></section>'}else{html='<section class="section"><h2>Página no encontrada</h2><a href="#/">Ir al inicio</a></section>'}document.getElementById('app').innerHTML=html;scrollTo(0,0)}addEventListener('hashchange',render);render();</script><style>.searchbar{width:100%;padding:15px 18px;border:1px solid #38506b;background:#101e31;color:white;border-radius:14px;font:inherit;margin:12px 0 25px}.pill{display:inline-block;border:1px solid #36506b;border-radius:30px;padding:8px 15px;margin:4px;background:#15233a;color:white;cursor:pointer}.pill.active{background:#43d3e4;color:#08111b}.empty{padding:24px;color:#b0bfd2}</style><script>let activeFilter='Todos';function enhanceCatalog(){const grid=document.querySelector('.grid');if(!grid||!location.hash.includes('/catalogo'))return;const title=grid.previousElementSibling;const tools=document.createElement('div');tools.innerHTML='<input class="searchbar" id="catalogSearch" type="search" placeholder="Buscar aplicaciones..." aria-label="Buscar aplicaciones"><div id="filterButtons"></div><p class="muted" id="catalogCount"></p>';grid.parentNode.insertBefore(tools,grid);const filters=['Todos','TV','Mobile','Media','Administración'];function draw(){const q=(document.getElementById('catalogSearch').value||'').toLowerCase().trim();const matches=products.filter(p=>(activeFilter==='Todos'||p.tag.toLowerCase().includes(activeFilter.toLowerCase())||p.name.toLowerCase().includes(activeFilter.toLowerCase()))&&(p.name+' '+p.desc+' '+p.tag).toLowerCase().includes(q));grid.innerHTML=matches.length?matches.map(card).join(''):'<div class="empty">No se encontraron aplicaciones.</div>';document.getElementById('catalogCount').textContent=matches.length+' aplicaciones encontradas';document.getElementById('filterButtons').innerHTML=filters.map(x=>'<button type="button" class="pill '+(x===activeFilter?'active':'')+'" data-filter="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;draw()})}document.getElementById('catalogSearch').addEventListener('input',draw);draw()}const originalRender=render;render=function(){originalRender();enhanceCatalog()};render();</script><style>.admin-note{max-width:900px;margin:30px auto;padding:22px;border:1px solid #304964;border-radius:18px;background:#101e31}.admin-note input,.admin-note textarea{width:100%;padding:12px;margin:6px 0 14px;background:#0a1424;border:1px solid #38506b;color:#fff;border-radius:9px;font:inherit}.admin-note label{display:block;font-weight:600}.admin-note button{background:#43d3e4;color:#08111b;border-radius:9px;padding:12px 18px;font-weight:700;margin:4px}.admin-note .secondary{background:#253750;color:#fff}.admin-note .warning{color:#ffd49a}</style><script>const starterProducts=products.map(p=>({...p}));function safeText(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function loadLocal(){try{const a=JSON.parse(localStorage.getItem('boxpanel_draft_products')||'null');if(Array.isArray(a)&&a.every(p=>p&&typeof p.name==='string'&&typeof p.id==='string')){products.splice(0,products.length,...a)}}catch(e){}}loadLocal();function draftAdmin(){if(location.hash!=='#/editor-local')return;const root=document.getElementById('app');root.innerHTML='<section class="admin-note"><a class="back" href="#/">← Volver al inicio</a><h1>Editor local de demostración</h1><p class="warning">No es un panel privado. Los cambios solo se guardan en este navegador y no se publican para otros visitantes. No introduzcas contraseñas ni información confidencial.</p><div id="editorItems"></div><button id="addDraft">+ Agregar producto</button><button id="saveDraft">Guardar borrador local</button><button id="resetDraft" class="secondary">Restablecer ejemplos</button><p id="draftStatus" role="status"></p></section>';function drawEditor(){document.getElementById('editorItems').innerHTML=products.map((p,i)=>'<div class="card" style="margin:15px 0;min-height:0"><h3>Producto '+(i+1)+'</h3><label>Nombre<input data-i="'+i+'" data-k="name" value="'+safeText(p.name)+'" maxlength="80"></label><label>Categoría<input data-i="'+i+'" data-k="tag" value="'+safeText(p.tag)+'" maxlength="80"></label><label>Icono<input data-i="'+i+'" data-k="icon" value="'+safeText(p.icon)+'" maxlength="12"></label><label>Descripción<textarea data-i="'+i+'" data-k="desc" maxlength="500">'+safeText(p.desc)+'</textarea></label><button class="secondary" data-remove="'+i+'">Quitar</button></div>').join('');document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('input',()=>{products[Number(el.dataset.i)][el.dataset.k]=el.value}));document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{products.splice(Number(el.dataset.remove),1);drawEditor()})}drawEditor();document.getElementById('addDraft').onclick=()=>{products.push({id:'draft-'+Date.now(),name:'Nueva aplicación',tag:'TV',icon:'📺',desc:'Descripción pendiente'});drawEditor()};document.getElementById('saveDraft').onclick=()=>{localStorage.setItem('boxpanel_draft_products',JSON.stringify(products));document.getElementById('draftStatus').textContent='Borrador guardado en este dispositivo.'};document.getElementById('resetDraft').onclick=()=>{products.splice(0,products.length,...starterProducts.map(p=>({...p})));localStorage.removeItem('boxpanel_draft_products');drawEditor();document.getElementById('draftStatus').textContent='Ejemplos restablecidos.'}}const renderBeforeEditor=render;render=function(){renderBeforeEditor();draftAdmin()};render();</script></body></html>
