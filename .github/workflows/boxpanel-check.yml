name: BOXPANEL backend syntax checks
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/boxpanel-check.yml'
  pull_request:
    paths:
      - 'backend/**'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker JavaScript syntax
        working-directory: backend
        run: |
          node --check src/index.js
          node --check src/reseller-api.js
          node --check src/master-api.js
      - name: Validate Worker config
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/boxpanel-build
