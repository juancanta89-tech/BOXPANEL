name: Deploy BOXPANEL Worker (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boxpanel-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: boxpanel-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check fixed BOXPANEL target
        working-directory: backend
        run: |
          grep -qx 'name = "boxpanel-api"' wrangler.toml
          grep -qx 'database_id = "5fff43be-94a2-4c72-b689-7fd04fdc7d26"' wrangler.toml
          node --check src/index.js
          node --check src/reseller-api.js
          node --check src/master-api.js
      - name: Block unsafe production deployment
        working-directory: backend
        run: |
          if grep -q 'REPLACE_WITH_' wrangler.toml; then
            echo 'Cloudflare Access is not configured; production deployment blocked.'
            exit 1
          fi
          if [ ! -f .production-ready ]; then
            echo 'D1 migration, login and storage must be verified before deployment.'
            exit 1
          fi
      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Deploy BOXPANEL only
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BOXPANEL_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7c38999ef8b7043e5629eccdecd9a961"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing BOXPANEL_CLOUDFLARE_API_TOKEN"; exit 1; }
          npm run check
          npm test
          npm run assets
          npx wrangler deploy --name boxpanel-api
